{% extends "shop/base.html" %}

{% block content %}
<style>
    /* Custom CSS for the Home Hero Section (same as before) */
    :root {
        --primary-gold: #FFD700;
        --neon-blue: #00FFFF;
    }

    .hero-section {
        height: 60vh;
        min-height: 450px;
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        margin-top: 30px;
        
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), 
                    url('https://images.unsplash.com/photo-1549399566-f56f18378546?auto=format&fit=crop&w=1920&q=80') center center / cover;
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.2); 
    }

    .hero-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 90%;
        max-width: 800px;
    }

    .hero-title {
        font-family: 'Audiowide', sans-serif;
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 20px;
        color: var(--primary-gold);
        text-shadow: 0 0 15px var(--primary-gold), 0 0 25px rgba(255, 215, 0, 0.8);
        letter-spacing: 2px;
    }

    .hero-intro {
        font-size: 1.25rem;
        color: #CCC;
        margin-bottom: 30px;
        text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
    }

    .btn-collection {
        background: linear-gradient(45deg, var(--neon-blue), var(--primary-gold));
        border: none;
        color: black;
        font-weight: 700;
        padding: 12px 40px;
        border-radius: 10px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }

    .btn-collection:hover {
        background: linear-gradient(45deg, var(--primary-gold), var(--neon-blue));
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        transform: scale(1.05);
    }
    
    /* Custom Styling for Flagship Cards in Home */
    .flagship-card .card-img-top {
        height: 200px;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .flagship-card:hover .card-img-top {
        transform: scale(1.05);
    }
    .flagship-card .card-body {
        background: rgba(26, 26, 26, 0.9);
    }
    .flagship-card .card-title {
        color: var(--neon-blue);
        text-shadow: 0 0 5px rgba(0, 255, 255, 0.4);
    }
</style>

<div class="hero-section">
    <div class="hero-content">
        <h1 class="hero-title">{{ title }}</h1>
        <p class="hero-intro">{{ intro_text }}</p>
        <a href="{% url 'product_list' %}" class="btn-collection" type="button">
            იხილეთ კოლექცია <i class="fas fa-arrow-right"></i>
        </a>
    </div>
</div>

<div class="container mt-5">
